const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  // conținutul e comprimat (gzip) înainte de criptare
  const html = P.gz ? await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text() : new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {

  const pw = document.getElementById("pw").value, err = document.getElementById("err");

    await open_(pw);
