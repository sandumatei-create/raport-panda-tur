const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  // conținutul e comprimat (gzip) înainte de criptare
  const html = P.gz ? await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text() : new TextDecoder().decode(plain);
  // tokenul pentru butonul «Actualizează acum» (serverul îl compară cu sha256 din parola din .env)
  const tok = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("cockpit-refresh:" + pw));
  window.__COCKPIT_TOKEN = [...new Uint8Array(tok)].map(b => b.toString(16).padStart(2, "0")).join("");
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, err = document.getElementById("err");
  err.textContent = "Se deschide…";
  try {
    if (document.getElementById("rem").checked) { try { localStorage.setItem("raport_pw", pw); } catch (_) {} }
    await open_(pw);
  } catch (_) { err.textContent = "Parolă greșită. Încearcă din nou."; try { localStorage.removeItem("raport_pw"); } catch (_) {} }
});
(async () => { let pw = null; try { pw = localStorage.getItem("raport_pw"); } catch (_) {} if (pw) { try { await open_(pw); } catch (_) { try { localStorage.removeItem("raport_pw"); } catch (_) {} } } })();
})();
